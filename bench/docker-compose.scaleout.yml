# 스케일아웃 시험: 게이트웨이를 여러 대 띄워 nginx 로드밸런서 뒤에 두고, 실제 Redis 로 한도를 공유한다.
# docker-compose.yml(gwbench, 단일 인스턴스 비교)과 프로젝트 이름이 달라 서로 지우지 않는다.
#   ./scaleout.sh limits | outage | throughput
# CPU 배분(VM 14코어): 게이트웨이 1코어 × 최대 4 + LB 2 + k6 3 + postgres 2 + redis 1 + 가짜 업스트림 1 = 13
name: gwscale

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: gateway
    tmpfs:
      - /var/lib/postgresql/data
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gateway"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    cpus: 1

  fakeupstream:
    build: ./fakeupstream
    cpus: 1
    command:
      - "-delay=${UPSTREAM_DELAY:-50ms}"
      - "-ttft=${UPSTREAM_TTFT:-50ms}"
      - "-chunk-delay=${UPSTREAM_CHUNK_DELAY:-5ms}"

  # 몇 대를 띄울지는 --scale gateway=N 으로 정한다(scaleout.sh)
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    image: llm-gateway:bench
    cpus: ${GW_CPUS:-1}
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      GATEWAY_MASTER_KEY: sk-bench-master
      GATEWAY_DATABASE_URL: postgres://postgres:bench@postgres:5432/gateway
      GATEWAY_LOGIN_METHODS: password
      GATEWAY_COUNTER_STORE: ${COUNTER_STORE:-redis}
      GATEWAY_REDIS_URL: redis://redis:6379/0

  lb:
    image: nginx:alpine
    cpus: 2
    volumes:
      - ./scaleout/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
    ports:
      - "4730:8080"

  k6:
    profiles: ["k6"]
    image: grafana/k6:1.0.0
    cpus: 3
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
