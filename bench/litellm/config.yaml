# litellm 쪽 모델 설정. 우리 게이트웨이는 같은 모델을 /model/new 로 등록한다(run.sh)
model_list:
  - model_name: bench-model
    litellm_params:
      model: openai/bench-model
      api_base: http://fakeupstream:9100/v1
      api_key: dummy
    # 단가가 없으면 litellm 이 비용 추적에 실패해 사용량 기록과 spend 갱신을 건너뛴다. 두 게이트웨이에 같은 단가를 줘서
    # 사용량 기록·spend 갱신을 모두 하게 한다(안 그러면 한쪽만 일을 덜 하는 불공정한 비교가 된다)
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
