# 게이트웨이 여러 대 앞의 로드밸런서. gateway 서비스 이름이 여러 주소로 풀리므로 요청을 돌아가며 보낸다.
# 이름은 nginx 가 시작할 때 한 번 풀리므로 게이트웨이를 먼저 모두 띄운 뒤 lb 를 띄운다
worker_processes auto;
events { worker_connections 8192; }
http {
  upstream gw {
    server gateway:4000;
    keepalive 512;
  }
  server {
    listen 8080;
    location / {
      proxy_pass http://gw;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;      # 스트림이 모였다 나가지 않게
      proxy_read_timeout 120s;
    }
  }
}
