spring.application.name=llm-gateway

# 비밀 값은 환경 변수로만 넣는다(설계 11.1)
gateway.master-key=${GATEWAY_MASTER_KEY:}

# 런타임은 R2DBC, 기동 시 마이그레이션만 Flyway(JDBC). 같은 DB 를 가리킨다
gateway.db.host=${GATEWAY_DB_HOST:localhost}
gateway.db.port=${GATEWAY_DB_PORT:5432}
gateway.db.name=${GATEWAY_DB_NAME:gateway}
spring.r2dbc.url=r2dbc:postgresql://${gateway.db.host}:${gateway.db.port}/${gateway.db.name}
spring.r2dbc.username=${GATEWAY_DB_USER:gateway}
spring.r2dbc.password=${GATEWAY_DB_PASSWORD:}
spring.flyway.url=jdbc:postgresql://${gateway.db.host}:${gateway.db.port}/${gateway.db.name}
spring.flyway.user=${spring.r2dbc.username}
spring.flyway.password=${spring.r2dbc.password}
